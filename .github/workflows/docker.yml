---
name: Build and Push Fluent Bit Image

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: docker-build
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest

    outputs:
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install regctl
        run: |
          curl -L https://github.com/regclient/regclient/releases/latest/download/regctl-linux-amd64 \
            -o /usr/local/bin/regctl
          chmod +x /usr/local/bin/regctl

      - name: Resolve upstream Fluent Bit tags
        id: upstream
        run: |
          TAGS=$(regctl tag ls docker.io/fluent/fluent-bit)

          DISTROLESS_PATCH=$(echo "${TAGS}" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)

          echo "distroless_patch=${DISTROLESS_PATCH}" >> ${GITHUB_OUTPUT}

      - name: Compute Git version tag (rN + commit)
        id: version
        run: |
          git fetch --tags

          PREFIX="${{ steps.upstream.outputs.distroless_patch }}"

          LAST=$(git tag --list "${PREFIX}-r*" | sed -E 's/.*-r([0-9]+)-.*/\1/' | sort -n | tail -n 1)

          if [ -z "${LAST}" ]; then
            REV=0
          else
            REV=$((LAST + 1))
          fi

          SHA_SHORT=$(git rev-parse --short HEAD)
          TAG="${PREFIX}-r${REV}-${SHA_SHORT}"

          echo "tag=${TAG}" >> ${GITHUB_OUTPUT}

      - name: Create and push git tag
        run: |
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

  build:
    needs: tag
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: latest

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Install regctl
        run: |
          curl -L https://github.com/regclient/regclient/releases/latest/download/regctl-linux-amd64 \
            -o /usr/local/bin/regctl
          chmod +x /usr/local/bin/regctl

      - name: Resolve upstream Fluent Bit tags
        id: upstream
        run: |
          TAGS=$(regctl tag ls docker.io/fluent/fluent-bit)

          DISTROLESS_PATCH=$(echo "${TAGS}" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)

          echo "distroless_patch=${DISTROLESS_PATCH}" >> ${GITHUB_OUTPUT}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: distroless.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            drew1kun/fluentbit:${{ steps.upstream.outputs.distroless_patch }}-distroless
            ghcr.io/drew1kun/fluentbit:${{ steps.upstream.outputs.distroless_patch }}-distroless
